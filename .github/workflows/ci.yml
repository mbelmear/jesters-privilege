name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  workflows:
    name: Lint workflows
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      # actionlint also runs shellcheck on every `run:` block.
      - uses: docker://rhysd/actionlint:1.7.12
        with:
          args: -color
      # actionlint's shellcheck covers only workflows' run: blocks. The unit
      # tests check composite actions' (scripts/shellcheck-actions.test.ts).
      - run: npm run --silent lint:shell
      # Template injection, permissions, and credentials left in a checkout.
      - run: npm run --silent lint:zizmor

  check:
    name: Format, lint, typecheck, unit tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:coverage

  # Is this pull request only docs/** and top-level Markdown, which nothing built
  # or browser-tested reads? The jobs below skip if so. They skip by `if:`,
  # not the workflow's `paths-ignore`, because main's required checks count a
  # skipped job as passed and wait forever for one that never starts.
  #
  # `!cancelled()` runs them when this job was skipped (a push to main) or
  # failed, so a broken check costs time, not coverage. The jobs after the
  # build name its result too, because the default condition would skip them
  # for this job, however far back in `needs` it sits (#171 showed it), and a
  # skipped job passes as a required check. scripts/workflows.test.ts holds each
  # job to this.
  docs-only:
    name: Docs-only check
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    outputs:
      docs-only: ${{ steps.check.outputs.docs-only }}
    steps:
      # A pull request checks out as its merge into the base, so the first
      # parent is the base, and each push is judged on the whole PR.
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          fetch-depth: 2
      - id: check
        run: |
          result=$(scripts/docs-only.sh HEAD^1 HEAD)
          echo "docs-only=$result" >> "$GITHUB_OUTPUT"

  build:
    name: Build static site
    needs: docs-only
    if: >-
      !cancelled() && needs.docs-only.outputs.docs-only != 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - uses: ./.github/actions/image-cache
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: out/
          retention-days: 1
          if-no-files-found: error

  e2e:
    name: Playwright (Chromium, WebKit)
    needs: build
    if: >-
      !cancelled() && needs.build.result == 'success'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - uses: actions/download-artifact@v4
        with:
          name: site
          path: out/
      - uses: ./.github/actions/playwright-browsers
        with:
          browsers: chromium webkit
      - run: npm run test:e2e
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
          if-no-files-found: error

  # Warns, without failing, when a pull request removes or renames a browser
  # test. Its specs read the built site.
  dropped-tests:
    name: Dropped browser tests
    needs: build
    if: >-
      !cancelled() && needs.build.result == 'success' &&
      github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - uses: actions/download-artifact@v4
        with:
          name: site
          path: out/
      # The token is here for when the repo is private (#145); git reads it
      # through gh, only in this step.
      - run: |
          gh auth setup-git
          git fetch --quiet --depth=1 origin "$BASE"
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          GH_TOKEN: ${{ github.token }}
      - run: npm run dropped-tests -- "$BASE"
        env:
          BASE: ${{ github.event.pull_request.base.sha }}

  # The site before Episode 1: a full build from the empty feed, which fails
  # if any route can't export with no Episodes, then the coming-soon journey.
  e2e-empty-feed:
    name: Playwright, empty feed (Chromium, WebKit)
    needs: docs-only
    if: >-
      !cancelled() && needs.docs-only.outputs.docs-only != 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - uses: ./.github/actions/image-cache
      - run: npm run build:empty-feed
      - uses: ./.github/actions/playwright-browsers
        with:
          browsers: chromium webkit
      - run: npm run test:e2e:empty-feed
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-empty-feed
          path: playwright-report/
          retention-days: 14
          if-no-files-found: ignore

  lighthouse:
    name: Lighthouse (mobile budget)
    needs: build
    if: >-
      !cancelled() && needs.build.result == 'success'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - uses: actions/download-artifact@v4
        with:
          name: site
          path: out/
      - run: npm run lighthouse
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-reports
          path: .lighthouseci/reports/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
