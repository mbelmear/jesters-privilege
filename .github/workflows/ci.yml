name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  workflows:
    name: Lint workflows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # actionlint also runs shellcheck on every `run:` block.
      - uses: docker://rhysd/actionlint:1.7.12
        with:
          args: -color
      # The runner has shellcheck; actionlint's covers only workflows' run: blocks.
      - run: npm run --silent lint:shell

  check:
    name: Format, lint, typecheck, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:coverage

  build:
    name: Build static site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
      - uses: ./.github/actions/image-cache
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: out/
          retention-days: 1
          if-no-files-found: error

  e2e:
    name: Playwright (Chromium, WebKit)
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
      - uses: actions/download-artifact@v4
        with:
          name: site
          path: out/
      - uses: ./.github/actions/playwright-browsers
        with:
          browsers: chromium webkit
      - run: npm run test:e2e
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
          if-no-files-found: error

  # Warns, without failing, when a pull request removes or renames a browser
  # test. Its specs read the built site.
  dropped-tests:
    name: Dropped browser tests
    if: github.event_name == 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
      - uses: actions/download-artifact@v4
        with:
          name: site
          path: out/
      - run: |
          git fetch --quiet --depth=1 origin "$BASE"
          npm run dropped-tests -- "$BASE"
        env:
          BASE: ${{ github.event.pull_request.base.sha }}

  # The site before Episode 1: a full build from the empty feed, which fails
  # if any route can't export with no Episodes, then the coming-soon journey.
  e2e-empty-feed:
    name: Playwright, empty feed (Chromium, WebKit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
      - uses: ./.github/actions/image-cache
      - run: npm run build:empty-feed
      - uses: ./.github/actions/playwright-browsers
        with:
          browsers: chromium webkit
      - run: npm run test:e2e:empty-feed
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-empty-feed
          path: playwright-report/
          retention-days: 14
          if-no-files-found: ignore

  lighthouse:
    name: Lighthouse (mobile budget)
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
      - uses: actions/download-artifact@v4
        with:
          name: site
          path: out/
      - run: npm run lighthouse
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-reports
          path: .lighthouseci/reports/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
