name: Nightly

on:
  schedule:
    # 09:00 UTC, the middle of the night in Bozeman.
    - cron: "0 9 * * *"
  workflow_dispatch:

jobs:
  firefox:
    name: Playwright (Firefox)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
      - run: npm run build
      - uses: ./.github/actions/playwright-browsers
        with:
          browsers: firefox
      # The runner has no sound card, and without one Firefox breaks off playback
      # a moment after it starts (OnMediaSinkAudioError), failing the player's
      # tests. A silent PulseAudio sink stands in (#29).
      - name: Give Firefox a sound device
        run: |
          sudo apt-get install --yes --no-install-recommends pulseaudio
          pulseaudio --start --exit-idle-time=-1
          pactl load-module module-null-sink sink_name=silence
          pactl set-default-sink silence
      - run: npm run test:e2e:firefox
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
          if-no-files-found: error
