name: Nightly

on:
  schedule:
    # 09:00 UTC, the middle of the night in Bozeman.
    - cron: "0 9 * * *"
  workflow_dispatch:
  # A pull request that changes the failure report runs it, writing nothing.
  pull_request:
    paths:
      - .github/workflows/nightly.yml
      - scripts/report-nightly.ts
      - scripts/failed-run.ts
      - src/lib/nightly-report.ts

permissions:
  contents: read

jobs:
  firefox:
    name: Playwright (Firefox)
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
      - uses: ./.github/actions/image-cache
      - run: npm run build
      - uses: ./.github/actions/playwright-browsers
        with:
          browsers: firefox
      # The runner has no sound card, and without one Firefox breaks off playback
      # a moment after it starts (OnMediaSinkAudioError), failing the player's
      # tests. A silent PulseAudio sink stands in (#29).
      - name: Give Firefox a sound device
        run: |
          sudo apt-get install --yes --no-install-recommends pulseaudio
          pulseaudio --start --exit-idle-time=-1
          pactl load-module module-null-sink sink_name=silence
          pactl set-default-sink silence
      - run: npm run test:e2e:firefox
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
          if-no-files-found: error

  # Nobody reads a red run in the Actions tab, so a scheduled failure opens an
  # issue, or adds to the one still open. See scripts/report-nightly.ts.
  report:
    name: Report the failure
    needs: firefox
    if: failure() && github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      issues: write
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
      - run: npm run report-nightly -- "$GITHUB_RUN_ID"
        env:
          GH_TOKEN: ${{ github.token }}

  report-preview:
    name: Preview the failure report
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      issues: read
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
      - run: npm run --silent report-nightly -- --dry-run > nightly-report.txt
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: actions/upload-artifact@v4
        with:
          name: nightly-report
          path: nightly-report.txt
          retention-days: 7
          if-no-files-found: error
