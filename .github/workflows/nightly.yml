name: Nightly

on:
  schedule:
    # 09:00 UTC, the middle of the night in Bozeman.
    - cron: "0 9 * * *"
  workflow_dispatch:
  # A pull request that changes the failure report runs it, writing nothing.
  # One that changes the Email Routing check's files, listed next, or the
  # address it checks (wrangler.jsonc) runs that too: it only reads. One that
  # changes .github runs everything but Firefox: the zizmor audit is the point.
  pull_request:
    paths:
      - scripts/report-nightly.ts
      - scripts/failed-run.ts
      - src/lib/nightly-report.ts
      - src/lib/near-timeout.ts
      - scripts/email-routing-check.ts
      - src/lib/email-routing-check.ts
      - src/lib/email-destination.ts
      - wrangler.jsonc
      - .github/**

permissions:
  contents: read

jobs:
  firefox:
    name: Playwright (Firefox)
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - uses: ./.github/actions/image-cache
      - run: npm run build
      - uses: ./.github/actions/playwright-browsers
        with:
          browsers: firefox
      # The runner has no sound card, and without one Firefox breaks off playback
      # a moment after it starts (OnMediaSinkAudioError), failing the player's
      # tests. A silent PulseAudio sink stands in (#29).
      - name: Give Firefox a sound device
        run: |
          sudo apt-get install --yes --no-install-recommends pulseaudio
          pulseaudio --start --exit-idle-time=-1
          pactl load-module module-null-sink sink_name=silence
          pactl set-default-sink silence
      # A test that passes near its timeout fails the run, so the report
      # below names it before a slower runner times it out (#199).
      - run: npm run test:e2e:firefox
        env:
          NEAR_TIMEOUT_FAILS: "true"
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
          if-no-files-found: error

  # The Email Routing prerequisites only the Cloudflare dashboard shows
  # (docs/deploy.md, Account prerequisites): an unverified Gmail fails every
  # Submission, and nothing else notices until a visitor tries (#159).
  # Dependabot's and forks' pull requests run without the repo's secrets.
  email-routing:
    name: Email Routing
    if: >-
      github.event_name != 'pull_request' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login != 'dependabot[bot]')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: npm run email-routing-check
        env:
          CLOUDFLARE_READ_TOKEN: ${{ secrets.CLOUDFLARE_READ_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  # zizmor online: an action with a GitHub security advisory, or a pinned
  # commit that isn't the action's own. Lint workflows and the commit hook run
  # it offline, so nothing else checks GitHub (#178). Nightly isn't a required
  # check, so an advisory or an outage can't block an unrelated merge. Its
  # findings are annotations, which the failure report names.
  zizmor:
    name: zizmor (online)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - run: scripts/zizmor.sh --no-progress --format github .github
        env:
          GH_TOKEN: ${{ github.token }}

  # Nobody reads a red run in the Actions tab, so a scheduled failure opens an
  # issue, or adds to the one still open. See scripts/report-nightly.ts.
  report:
    name: Report the failure
    needs: [firefox, email-routing, zizmor]
    if: failure() && github.event_name == 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      issues: write
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: npm run report-nightly -- "$GITHUB_RUN_ID"
        env:
          GH_TOKEN: ${{ github.token }}

  report-preview:
    name: Preview the failure report
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      issues: read
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: npm run --silent report-nightly -- --dry-run > nightly-report.txt
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: actions/upload-artifact@v4
        with:
          name: nightly-report
          path: nightly-report.txt
          retention-days: 7
          if-no-files-found: error
