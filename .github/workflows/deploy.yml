name: Deploy

# Builds the static export and ships it to Cloudflare with wrangler.
# Pushes to main and the Run workflow button deploy to production; each pull
# request from this repo's own branches gets its own preview URL, posted as a
# comment (Dependabot's and forks' run without secrets, so they skip it, and a
# docs-only one has no page to preview). Every 2 hours the feed
# check deploys only when the feed has an Episode the live site lacks, or an
# Episode has gained an Episode Listen link or a Transcript (transcribe.yml
# makes them). See docs/deploy.md.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    # Every 2 hours at 17 past: GitHub delays and drops the most scheduled runs
    # at the top of the hour.
    - cron: "17 */2 * * *"

permissions:
  contents: read

jobs:
  # The same check as ci.yml's, which explains it.
  docs-only:
    name: Docs-only check (preview)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      docs-only: ${{ steps.check.outputs.docs-only }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          fetch-depth: 2
      - id: check
        run: |
          result=$(scripts/docs-only.sh HEAD^1 HEAD)
          echo "docs-only=$result" >> "$GITHUB_OUTPUT"

  preview:
    name: Preview URL
    needs: docs-only
    # Only pull requests that get the repo's secrets: GitHub runs a fork's
    # and Dependabot's without them, and the build stops on the empty
    # Turnstile key. Their required checks (ci.yml) still build and test them;
    # Dependabot gets no copy of the Cloudflare token. `!cancelled()` builds the
    # preview if the docs-only check fails.
    if: >-
      !cancelled() && needs.docs-only.outputs.docs-only != 'true' &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    concurrency:
      group: preview-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - uses: ./.github/actions/image-cache
      - run: npm run build
        env:
          BUILD_COMMIT: ${{ github.event.pull_request.head.sha }}
          # The Jesters review previews against the real Episodes.
          FEED: live
          # Marks pages that use draft content with the DRAFT ribbon.
          SITE_ENV: preview
          # The Submit page's Turnstile widget (src/lib/turnstile.ts).
          TURNSTILE_SITE_KEY: ${{ secrets.TURNSTILE_SITE_KEY }}
          # Spotify's Episode Listen links (src/lib/spotify-lookup.ts). A
          # preview without them skips the lookup; the feed check and the
          # production build report it.
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
      # A preview version can only be uploaded to a Worker that exists. Before the
      # first production deploy it doesn't, so create it once with a blank
      # placeholder page on workers.dev only: no custom domains, no PR content.
      - name: Create the Worker on first run
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if npx wrangler deployments list --name jesters-privilege >/dev/null 2>&1; then
            exit 0
          fi
          echo "::notice::Worker not found; creating it with a placeholder page"
          dir="$RUNNER_TEMP/placeholder"
          mkdir -p "$dir"
          echo '<!doctype html><title>Coming soon</title>' > "$dir/index.html"
          cat > "$RUNNER_TEMP/bootstrap.json" <<JSON
          {
            "name": "jesters-privilege",
            "compatibility_date": "2026-10-01",
            "assets": { "directory": "$dir" },
            "workers_dev": true,
            "preview_urls": true
          }
          JSON
          npx wrangler deploy --config "$RUNNER_TEMP/bootstrap.json"
      - name: Upload a preview version
        id: upload
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TURNSTILE_SECRET_KEY: ${{ secrets.TURNSTILE_SECRET_KEY }}
          ALIAS: pr-${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          jq -n '{TURNSTILE_SECRET_KEY: env.TURNSTILE_SECRET_KEY}' > "$RUNNER_TEMP/secrets.json"
          npx wrangler versions upload --preview-alias "$ALIAS" \
            --secrets-file "$RUNNER_TEMP/secrets.json" \
            --message "PR #${{ github.event.pull_request.number }} at ${HEAD_SHA::7}" \
            | tee upload.log
          url=$(grep -oE "https://$ALIAS-[a-z0-9.-]+\.workers\.dev" upload.log | head -1)
          if [ -z "$url" ]; then
            echo "::error::wrangler printed no preview URL for $ALIAS"
            exit 1
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"
      - name: Post the preview URL on the pull request
        env:
          GH_TOKEN: ${{ github.token }}
          URL: ${{ steps.upload.outputs.url }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          # The marker finds this workflow's comment so each push edits it in
          # place, whatever else gets posted on the pull request.
          marker="<!-- deploy-preview -->"
          body=$(printf '%s\n**Preview:** %s\n\nBuilt from %s. This comment updates on every push.' \
            "$marker" "$URL" "$HEAD_SHA")
          id=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" --paginate \
            --jq ".[] | select(.body | startswith(\"$marker\")) | .id" | head -1)
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$id" -f body="$body" >/dev/null
          else
            gh pr comment "$PR" --body "$body"
          fi

  feed-check:
    name: Feed check
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      rebuild: ${{ steps.check.outputs.rebuild }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      # Sets rebuild=true only when the feed's newest Episode isn't on the live
      # site, or an Episode has gained an Episode Listen link or a Transcript
      # since. A feed or
      # live manifest that can't be read fails this job, so nothing deploys.
      - id: check
        run: npm run feed-check
        env:
          FEED: live
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}

  deploy:
    name: Deploy to production
    needs: feed-check
    # Pushes and the Run workflow button always deploy; a scheduled run only
    # when the feed check asks. The button can pick any branch; only main
    # reaches production. `!cancelled()` lets this run when the feed check was
    # skipped, as it is for every trigger but the schedule.
    if: >-
      !cancelled() && github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch' ||
      needs.feed-check.outputs.rebuild == 'true')
    runs-on: ubuntu-latest
    # Queue production deploys; never cancel one partway.
    concurrency:
      group: production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      # The send_email binding delivers only to a verified Email Routing
      # destination, and nothing else catches one that isn't: every Submission
      # would fail with the delivery error, as they did until 2026-11-03
      # (#114). Not verified, unlisted, or unreadable stops the deploy here.
      - name: Check the Submission email's destination is verified
        run: npm run email-destination
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - uses: ./.github/actions/image-cache
      # A failed build stops here, so the last good deploy stays live.
      - run: npm run build
        env:
          BUILD_COMMIT: ${{ github.sha }}
          # The build fails without it rather than publish the fixture
          # (src/lib/feed-source.ts).
          FEED: live
          # Only this build counts visits (src/lib/analytics.ts); it fails
          # without the token.
          SITE_ENV: production
          WEB_ANALYTICS_TOKEN: ${{ vars.WEB_ANALYTICS_TOKEN }}
          TURNSTILE_SITE_KEY: ${{ secrets.TURNSTILE_SITE_KEY }}
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
      - run: |
          jq -n '{TURNSTILE_SECRET_KEY: env.TURNSTILE_SECRET_KEY}' > "$RUNNER_TEMP/secrets.json"
          npx wrangler deploy --message "${GITHUB_SHA::7}" \
            --secrets-file "$RUNNER_TEMP/secrets.json"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TURNSTILE_SECRET_KEY: ${{ secrets.TURNSTILE_SECRET_KEY }}
      - run: scripts/smoke-check.sh "$GITHUB_SHA"
