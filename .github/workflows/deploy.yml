name: Deploy

# Builds the static export and ships it to Cloudflare with wrangler.
# Pushes to main and the Run workflow button deploy to production; each pull
# request gets its own preview URL, posted as a comment. The feed check (#18)
# joins as a scheduled trigger. See docs/deploy.md.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

jobs:
  preview:
    name: Preview URL
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    concurrency:
      group: preview-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
      - run: npm run build
      - name: Upload a preview version
        id: upload
        env:
          ALIAS: pr-${{ github.event.pull_request.number }}
        run: |
          npx wrangler versions upload --preview-alias "$ALIAS" \
            --message "PR #${{ github.event.pull_request.number }} at ${GITHUB_SHA::7}" \
            | tee upload.log
          url=$(grep -oE "https://$ALIAS-[a-z0-9.-]+\.workers\.dev" upload.log | head -1)
          if [ -z "$url" ]; then
            echo "::error::wrangler printed no preview URL for $ALIAS"
            exit 1
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"
      - name: Post the preview URL on the pull request
        env:
          GH_TOKEN: ${{ github.token }}
          URL: ${{ steps.upload.outputs.url }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          body=$(printf '**Preview:** %s\n\nBuilt from %s. This comment updates on every push.' \
            "$URL" "${{ github.event.pull_request.head.sha }}")
          gh pr comment "$PR" --edit-last --create-if-none --body "$body"

  deploy:
    name: Deploy to production
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    # Queue production deploys; never cancel one partway.
    concurrency:
      group: production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
      # A failed build stops here, so the last good deploy stays live.
      - run: npm run build
      - run: npx wrangler deploy --message "${GITHUB_SHA::7}"
      - run: scripts/smoke-check.sh "$GITHUB_SHA"
