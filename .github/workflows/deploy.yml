name: Deploy

# Builds the static export and ships it to Cloudflare with wrangler.
# Pushes to main and the Run workflow button deploy to production; each pull
# request from this repo's own branches gets its own preview URL, posted as a
# comment (Dependabot's and forks' run without secrets, so they skip it, and a
# docs-only one has no page to preview). The feed check deploys only when
# the feed has an Episode the live site lacks, or an Episode has gained an
# Episode Listen link or a Transcript. The site Worker's hourly Cron Trigger
# starts it (ADR 0004), and GitHub's schedule runs it too, as a backstop that
# also fails when the Worker has stopped. Transcribe (transcribe.yml) starts
# this workflow itself once it pushes a Transcript, so the feed check only
# catches the Transcripts it missed. See docs/deploy.md.

# The runs the Worker started carry this name, which is how the backstop and
# the Deploy report find them (src/lib/feed-check-start.ts); every other run
# keeps GitHub's own name, since a blank run-name falls back to it (#305). The
# Worker's token belongs to a Jester, so a button run with feed-check ticked
# gets the same name; the input's description says to leave it off.
run-name: ${{ inputs.feed-check && 'Feed check started by the Worker' || '' }}

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      feed-check:
        description: >-
          Set only by the site Worker's hourly trigger: checks the feed first
          and deploys only if the site is behind. Leave it off; ticked, the
          run counts as the Worker's and hides a broken Worker for 3 hours.
        type: boolean
        default: false
  schedule:
    # The backstop (ADR 0004). Every 2 hours at 17 past: GitHub delays and
    # drops the most scheduled runs at the top of the hour. It drops many
    # anyway: 2 a day, not 12, from 2026-11-22 to 11-26 (docs/deploy.md,
    # Triggers).
    - cron: "17 */2 * * *"

permissions:
  contents: read

jobs:
  # The same check as ci.yml's, which explains it.
  docs-only:
    name: Docs-only check (preview)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      docs-only: ${{ steps.check.outputs.docs-only }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
      - id: check
        run: |
          result=$(scripts/docs-only.sh HEAD^1 HEAD)
          echo "docs-only=$result" >> "$GITHUB_OUTPUT"

  preview:
    name: Preview URL
    needs: docs-only
    # Only pull requests that get the repo's secrets: GitHub runs a fork's
    # and Dependabot's without them, and the build stops on the empty
    # Turnstile key. Their required checks (ci.yml) still build and test them;
    # Dependabot gets no copy of the Cloudflare token. `!cancelled()` builds the
    # preview if the docs-only check fails.
    if: >-
      !cancelled() && needs.docs-only.outputs.docs-only != 'true' &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      pull-requests: write
    concurrency:
      group: preview-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - uses: ./.github/actions/image-cache
      - run: npm run build
        env:
          BUILD_COMMIT: ${{ github.event.pull_request.head.sha }}
          # The Jesters review previews against the real Episodes.
          FEED: live
          # Marks pages that use draft content with the DRAFT ribbon.
          SITE_ENV: preview
          # The Submit page's Turnstile widget (src/lib/turnstile.ts).
          TURNSTILE_SITE_KEY: ${{ secrets.PREVIEW_TURNSTILE_SITE_KEY }}
          # Spotify's Episode Listen links (src/lib/spotify-lookup.ts). A run
          # without them logs the lookup as failed, naming each missing secret.
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
      - name: Upload a preview version
        id: upload
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.PREVIEW_CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.PREVIEW_CLOUDFLARE_ACCOUNT_ID }}
          TURNSTILE_SECRET_KEY: ${{ secrets.PREVIEW_TURNSTILE_SECRET_KEY }}
          ALIAS: pr-${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ] || [ -z "$TURNSTILE_SECRET_KEY" ]; then
            echo "::error::Preview Cloudflare and Turnstile credentials must be configured"
            exit 1
          fi
          jq -n '{TURNSTILE_SECRET_KEY: env.TURNSTILE_SECRET_KEY}' > "$RUNNER_TEMP/secrets.json"
          npx wrangler versions upload --config wrangler.preview.jsonc --preview-alias "$ALIAS" \
            --secrets-file "$RUNNER_TEMP/secrets.json" \
            --message "PR #${{ github.event.pull_request.number }} at ${HEAD_SHA::7}" \
            | tee upload.log
          url=$(grep -oE "https://$ALIAS-[a-z0-9.-]+\.workers\.dev" upload.log | head -1)
          if [ -z "$url" ]; then
            echo "::error::wrangler printed no preview URL for $ALIAS"
            exit 1
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"
      - name: Post the preview URL on the pull request
        env:
          GH_TOKEN: ${{ github.token }}
          URL: ${{ steps.upload.outputs.url }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          # The marker finds this workflow's comment so each push edits it in
          # place, whatever else gets posted on the pull request.
          marker="<!-- deploy-preview -->"
          body=$(printf '%s\n**Preview:** %s\n\nBuilt from %s. This comment updates on every push.' \
            "$marker" "$URL" "$HEAD_SHA")
          id=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" --paginate \
            --jq ".[] | select(.body | startswith(\"$marker\")) | .id" | head -1)
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$id" -f body="$body" >/dev/null
          else
            gh pr comment "$PR" --body "$body"
          fi

  feed-check:
    name: Feed check
    if: github.event_name == 'schedule' || inputs.feed-check
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      # The backstop lists Deploy's runs.
      actions: read
    outputs:
      rebuild: ${{ steps.check.outputs.rebuild }}
      new-episode: ${{ steps.check.outputs.new-episode }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      # Sets rebuild=true only when the feed's newest Episode isn't on the live
      # site, or an Episode has gained an Episode Listen link or a Transcript
      # since, and new-episode=true in the first case. A feed or live manifest
      # that can't be read fails this job, so nothing deploys.
      - id: check
        run: npm run feed-check
        env:
          FEED: live
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
      # The backstop (ADR 0004): a scheduled run fails here, opening "Feed
      # check is failing", when the Worker hasn't started a feed check for 3
      # hours, as when its token has expired. The check above has set its
      # outputs by then, so this run still deploys what it found.
      - name: Check the Worker is starting feed checks
        if: github.event_name == 'schedule'
        run: npm run feed-checks-started
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}

  deploy:
    name: Deploy to production
    needs: feed-check
    # Pushes and the Run workflow button always deploy; a feed check (the
    # schedule's, or a dispatch with feed-check on, as the Worker's are) only
    # when it asks. The button can pick any branch; only main reaches
    # production. `!cancelled()` lets this run when the feed check was
    # skipped, and when only the backstop's step failed.
    if: >-
      !cancelled() && github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' && !inputs.feed-check) ||
      needs.feed-check.outputs.rebuild == 'true')
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: production
    permissions:
      contents: read
      # Starts Transcribe after deploying a new Episode.
      actions: write
    # Queue production deploys; never cancel one partway.
    concurrency:
      group: production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      # The send_email binding delivers only to a verified Email Routing
      # destination, and nothing else catches one that isn't: every Submission
      # would fail with the delivery error, as they did until 2026-11-03
      # (#114). Not verified, unlisted, or unreadable stops the deploy here.
      - name: Check the Submission email's destination is verified
        run: npm run email-destination
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.PRODUCTION_CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.PRODUCTION_CLOUDFLARE_ACCOUNT_ID }}
      - uses: ./.github/actions/image-cache
      # A failed build stops here, so the last good deploy stays live.
      - run: npm run build
        env:
          BUILD_COMMIT: ${{ github.sha }}
          # The build fails without it rather than publish the fixture
          # (src/lib/feed-source.ts).
          FEED: live
          # Only this build counts visits (src/lib/analytics.ts); it fails
          # without the token.
          SITE_ENV: production
          WEB_ANALYTICS_TOKEN: ${{ vars.WEB_ANALYTICS_TOKEN }}
          TURNSTILE_SITE_KEY: ${{ secrets.PRODUCTION_TURNSTILE_SITE_KEY }}
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
      # DEPLOY_DISPATCH_TOKEN lets the Worker's Cron Trigger start the feed
      # check (ADR 0004; scripts/deploy-dispatch-token-wizard.sh makes it).
      - run: |
          if [ -z "$TURNSTILE_SECRET_KEY" ] || [ -z "$DEPLOY_DISPATCH_TOKEN" ]; then
            echo "::error::The production Turnstile secret and DEPLOY_DISPATCH_TOKEN must be configured"
            exit 1
          fi
          jq -n '{TURNSTILE_SECRET_KEY: env.TURNSTILE_SECRET_KEY, DEPLOY_DISPATCH_TOKEN: env.DEPLOY_DISPATCH_TOKEN}' \
            > "$RUNNER_TEMP/secrets.json"
          npx wrangler deploy --message "${GITHUB_SHA::7}" \
            --secrets-file "$RUNNER_TEMP/secrets.json"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.PRODUCTION_CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.PRODUCTION_CLOUDFLARE_ACCOUNT_ID }}
          TURNSTILE_SECRET_KEY: ${{ secrets.PRODUCTION_TURNSTILE_SECRET_KEY }}
          DEPLOY_DISPATCH_TOKEN: ${{ secrets.DEPLOY_DISPATCH_TOKEN }}
      - run: scripts/smoke-check.sh "$GITHUB_SHA"
      # A feed check that deployed a new newest Episode starts Transcribe now,
      # rather than leaving it to Transcribe's schedule, which GitHub may run
      # hours late. from-feed-check keeps it refusing an Episode older than a
      # week (#240). The Deploy that Transcribe starts once it pushes has the
      # feed check off, so this never loops. Runs once, never retries; a missed
      # Episode waits for Transcribe's schedule. A run whose deploy the
      # production queue cancels never gets here, but the Episode is still
      # new to the live site, so the next feed check deploys it and starts this.
      - name: Start Transcribe
        if: needs.feed-check.outputs.new-episode == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh workflow run transcribe.yml --ref main -f from-feed-check=true
